server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Las apps son un solo HTML con el JS y el CSS incrustados.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://hackathon.452111.xyz https://cdn.jsdelivr.net https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    location = /        { try_files /registro-alumno.html =404; }
    location = /caseta  { try_files /app-caseta.html =404; }
    location = /admin   { try_files /portal-admin.html =404; }
    location = /salud   { default_type text/plain; return 200 "ok\n"; }
    location ~ ^/(caseta|admin)/$ { return 301 /$1$is_args$args; }
    location / { return 404; }
}
